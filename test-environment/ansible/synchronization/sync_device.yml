---
- name: Sync NetBox devices to Icinga via API (ping-only)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # NetBox
    nb_url: "{{ lookup('env','NETBOX_API') | default('http://localhost:8000', true) }}"
    nb_token: "{{ lookup('env','NETBOX_TOKEN') }}"            # or site=DC1, role=Server, etc.
    netbox_validate_ssl: "{{ lookup('env', 'NETBOX_VALIDATE_SSL') | bool}}"
    # Icinga API
    icinga_url: "{{ lookup('env','ICINGA_API_URL') | default('https://localhost:5665', true) }}"
    icinga_user: "{{ lookup('env','ICINGA_API_USER') }}"
    icinga_pass: "{{ lookup('env','ICINGA_API_PASS') }}"
    icinga_verify_ssl: "{{ (lookup('env','ICINGA_VERIFY_SSL') | default('false')) | bool }}"
    icinga_netbox_flag: true

  tasks:
    - name: Fetch NetBox devices (tagged=monitor)
      vars:
        api_filter: "tag={{ tag_filter }}"
      set_fact:
        nb_devices: >-
          {{ lookup('netbox.netbox.nb_lookup', 'devices',
                    api_endpoint=nb_url, token=nb_token,
                    api_filter='cf_monitor=true', validate_certs=netbox_validate_ssl) }}

    - name: Fetch all device contact assignments via REST API
      ansible.builtin.uri:
        url: "{{ nb_url }}/api/tenancy/contact-assignments/?object_type=dcim.device&limit=0"
        method: GET
        headers:
          Authorization: "Token {{ nb_token }}"
          Accept: "application/json"
        validate_certs: "{{ netbox_validate_ssl }}"
        return_content: true
      register: api_contact_assignments

    - name: Fetch all contacts via REST API
      ansible.builtin.uri:
        url: "{{ nb_url }}/api/tenancy/contacts/?limit=0"
        method: GET
        headers:
          Authorization: "Token {{ nb_token }}"
          Accept: "application/json"
        validate_certs: "{{ netbox_validate_ssl }}"
        return_content: true
      register: api_contacts

    - name: Build minimal host payload for Icinga
      ansible.builtin.set_fact:
        desired_hosts: "{{ (desired_hosts | default([])) + [ host_entry ] }}"
      loop: "{{ [nb_devices] if nb_devices is mapping else nb_devices }}"
      loop_control:
        label: "{{ item.value.name }}"
      vars:
        host_entry: >-
          {%- set dev_id = item.value.id | int -%}
          {%- set matched_contact = {} -%}
          {%- for assign in api_contact_assignments.json.results -%}
            {%- set assign_obj_id = (assign.object_id | default(assign.assigned_object_id)) | int -%}
            {%- set assign_type = assign.object_type | default(assign.content_type) | default('') -%}
            {%- if assign_obj_id == dev_id and 'device' in (assign_type | string) -%}
              {%- for c in api_contacts.json.results -%}
                {%- if (c.id | int) == (assign.contact.id | int) -%}
                  {%- set _ = matched_contact.update({'name': c.name, 'email': c.email}) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{
            {
              'name': item.value.name,
              'ipv4': (item.value.primary_ip4.address.split('/')[0] if item.value.primary_ip4 else none),
              'contact_name': matched_contact.get('name', none),
              'contact_email': matched_contact.get('email', none)
            }
          }}

    - name: Verify Icinga payload
      ansible.builtin.debug:
        var: desired_hosts

    # -------- IDPOTENT UPSERT (GET -> POST or PUT) --------

    - name: Check if host exists
      when: desired_hosts | length > 0
      loop: "{{ desired_hosts }}"
      loop_control:
        label: "exists? {{ item.name }}"
      uri:
        url: "{{ icinga_url }}/v1/objects/hosts/{{ item.name }}"
        method: GET
        user: "{{ icinga_user }}"
        password: "{{ icinga_pass }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        validate_certs: "{{ icinga_verify_ssl }}"
        return_content: true
        status_code: [200, 404]
      register: host_exists

    - name: Print the raw contents of the registered variable
      debug:
        var: host_exists

    - name: Create host (PUT) when it does not exist
      when:
        - host_exists is defined
        - host_exists.results is defined
      loop: "{{ host_exists.results | selectattr('status','equalto',404) | map(attribute='item') | list }}"
      loop_control:
        label: "create {{ item.name }} -> {{ item.address }}"
      uri:
        url: "{{ icinga_url }}/v1/objects/hosts/{{ item.name }}"
        method: PUT
        user: "{{ icinga_user }}"
        password: "{{ icinga_pass }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        body_format: json
        validate_certs: "{{ icinga_verify_ssl }}"
        return_content: true
        body:
          attrs:
            check_command: "hostalive"
            address: "{{ item.address }}"
            vars:
              netbox: "{{ icinga_netbox_flag }}"
        status_code: [200]
      register: creates
      changed_when: >
        creates.json is defined and
        ('results' in creates.json) and
        (creates.json.results | map(attribute='status') | map('lower') | select('search','created') | list | length) > 0

    - name: Get existing Icinga hosts that came from NetBox
      uri:
        url: "{{ icinga_url }}/v1/objects/hosts?filter=host.vars.netbox==true"
        method: GET
        user: "{{ icinga_user }}"
        password: "{{ icinga_pass }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        validate_certs: "{{ icinga_verify_ssl }}"
        return_content: true
      register: existing_resp

    - name: Parse existing NetBox-derived host names
      set_fact:
        existing_netbox_hosts: "{{ (existing_resp.json.results | default([])) | map(attribute='name') | list }}"

    - name: Compute hosts to delete (in Icinga but not in NetBox anymore)
      set_fact:
        to_delete: "{{ existing_netbox_hosts | difference(desired_hosts | map(attribute='name') | list) }}"

    - name: Delete stale NetBox-derived hosts from Icinga
      when: to_delete | length > 0
      loop: "{{ to_delete }}"
      loop_control:
        label: "{{ item }}"
      uri:
        url: "{{ icinga_url }}/v1/objects/hosts/{{ item }}"
        method: POST
        user: "{{ icinga_user }}"
        password: "{{ icinga_pass }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        validate_certs: "{{ icinga_verify_ssl }}"
        body_format: json
        body:
          attrs:
            vars.disabled: true
            enable_active_checks: false
            enable_notifications: false
        return_content: true
        status_code: [200, 404]
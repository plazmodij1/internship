version: "3.8"

networks:
  netboxlab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.254

services:
  web01:
    image: alpine:3
    command: ["sleep","infinity"]
    networks:
      netboxlab:
        ipv4_address: 10.10.0.10

  db01:
    image: alpine:3
    command: ["sleep","infinity"]
    networks:
      netboxlab:
        ipv4_address: 10.10.0.11

  gw01:
    image: alpine:3
    command: ["sleep","infinity"]
    networks:
      netboxlab:
        ipv4_address: 10.10.0.1
include:
  - ./icinga/docker-compose.yml
  - path:
    - ./netbox/docker-compose.yml
    - ./netbox/docker-compose.override.yml
services:
  ansible-seed:
    build:
      context: ./ansible
      dockerfile: Dockerfile.ansible
    working_dir: /work
    container_name: ansible-seed
    env_file:
      - ./ansible/.env
    volumes:
      - ./ansible/netbox-data:/work:ro
    command: ["ansible-playbook", "/work/seed-netbox.yml"]
    networks:
      - public
  ansible-automation:
    build:
      context: ./ansible/
      dockerfile: Dockerfile.ansible
    working_dir: /work
    container_name: ansible-automation
    env_file:
      - ./ansible/.env
    volumes:
      - ./ansible/synchronization:/work:ro
    command: ["python", "/work/receiver.py"]
    restart: unless-stopped
    networks:
      - public
  https-proxy:
    #make sure proxy boots up after netbox and icinga are done booting up
    image: nginx:latest
    ports:
      - 443:443
    volumes:
      - ./nginx/nginx-https.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-cert:/etc/nginx/ssl:ro
    networks:
      public:
        aliases:
          - netbox.local
          - icinga.local
      
  nginx-device:
    container_name: monitor-device
    image: nginx:latest
    networks:
      - public

networks:
  public:
    name: public
    driver: bridge

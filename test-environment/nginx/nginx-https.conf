events {}
http {
    server {
        listen 443 ssl;
        server_name netbox.local;

    ssl_certificate /etc/nginx/ssl/netbox.crt;
    ssl_certificate_key /etc/nginx/ssl/netbox.key;

        location / {
            proxy_pass http://netbox:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 443 ssl;
        server_name icinga.local;

    ssl_certificate /etc/nginx/ssl/icinga.crt;
    ssl_certificate_key /etc/nginx/ssl/icinga.key;

        location /director/ {
            proxy_pass http://icingaweb:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API Optimizations: Pass auth headers transparently and disable buffering
            proxy_pass_request_headers on;
            proxy_buffering off;
            proxy_http_version 1.1;
        }
        location / {
            proxy_pass http://icingaweb:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}